name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    # macos-15 (Sequoia): the current GitHub runner. macos-14 is being retired.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake glfw sdl2 libopenmpt pkg-config
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIW_BUILD_TESTS=ON -DIW_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
  windows:
    # Exercises the MSVC path (/W4 /WX) + the <GL/gl.h> include + the
    # SDL_MAIN_HANDLED + Win32 link differences. GLFW is installed via
    # vcpkg (the Windows runner has no system GLFW import lib otherwise).
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          if (-not (Test-Path $env:VCPKG_ROOT)) {
            git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" install glfw3 sdl2 libopenmpt --triplet x64-windows
      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIW_BUILD_TESTS=ON -DIW_WARNINGS_AS_ERRORS=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Test
        shell: pwsh
        run: ctest --test-dir build --build-config Release --output-on-failure
  linux:
    # Exercises the non-Apple path (OpenGL::GL + <GL/gl.h>) which macOS CI never
    # covers. Needs a GL library for linking the renderer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build libglfw3-dev libgl-dev libgl1-mesa-dev libsdl2-dev libopenmpt-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DIW_BUILD_TESTS=ON -DIW_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
